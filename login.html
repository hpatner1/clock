<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shafin Shiga</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --input: #1f2937;
      --ring: rgba(34, 197, 94, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #1d4ed8 0%, var(--bg) 45%, #020617 100%);
      color: var(--text);
      padding: 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .header h1 {
      font-size: 1.55rem;
      margin-bottom: 0.4rem;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.45rem;
      color: #d1d5db;
    }

    .field input {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: var(--input);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: -0.2rem;
    }

    .options a,
    .signup a {
      color: #86efac;
      text-decoration: none;
    }

    .options a:hover,
    .signup a:hover {
      text-decoration: underline;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .login-btn {
      border: none;
      background: linear-gradient(90deg, var(--primary), #4ade80);
      color: #062e16;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(90deg, var(--primary-dark), var(--primary));
    }

    .signup {
      margin-top: 1.2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 460px) {
      .login-card {
        padding: 1.35rem;
      }

      .options {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <header class="header">
      <h1>Barka da zuwa</h1>
      <p>Shiga cikin asusunka domin ci gaba.</p>
    </header>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Adireshin Imel</label>
        <input type="email" id="email" name="email" placeholder="misali@email.com" required />
      </div>

      <div class="field">
        <label for="password">Kalmar Sirri</label>
        <input type="password" id="password" name="password" placeholder="Shigar da kalmar sirri" required />
      </div>

      <div class="options">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" name="remember" />
          Tuna da ni
        </label>
        <a href="#">Ka manta kalmar sirri?</a>
      </div>

      <button class="login-btn" type="submit">Shiga</button>
    </form>

    <p class="signup">
      Ba ka da asusu? <a href="#">Yi rajista yanzu</a>
    </p>
  </main>
</body>
</html>
