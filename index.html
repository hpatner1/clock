<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clock Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main_conte">
    <div class="main_cont">
        <p class="hour" aria-label="hour hand"></p>
        <p class="min" aria-label="minute hand"></p>
        <p class="sec" aria-label="second hand"></p>
        <p class="dot" aria-hidden="true"></p>
        <p class="date">01/12/2024</p>
        <div class="clock_cont" aria-hidden="true">
            <p>12</p>
            <p>3</p>
            <p>6</p>
            <p>9</p>
        </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
